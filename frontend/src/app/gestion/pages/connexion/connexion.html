<div class="connexion-page">
  <div class="panneau-marque">
    <div class="cadre"></div>
    <div class="mono">T</div>
    <div class="marque-contenu">
      <div class="logo">PAPE ALE ET BAMBA<span>.</span></div>
      <p class="slogan">L'élégance, au bout des doigts.</p>
    </div>
  </div>

  <div class="panneau-form">
    <div class="form-boite">
      <span class="surtitre">Espace gérant</span>
      <h1>Connexion</h1>
      <p class="intro">Accédez à la gestion de votre boutique.</p>

      <form [formGroup]="formulaire" (ngSubmit)="soumettre()">
        <div class="champ">
          <label>Nom d'utilisateur</label>
          <input
            type="text"
            formControlName="nom_utilisateur"
            autocomplete="username"
            placeholder="admin"
          />
        </div>

        <div class="champ">
          <label>Mot de passe</label>
          <div class="champ-mdp">
            <input
              [type]="motDePasseVisible() ? 'text' : 'password'"
              formControlName="mot_de_passe"
              autocomplete="current-password"
              placeholder="••••••••"
            />
            <button
              type="button"
              class="oeil"
              (click)="basculerMotDePasse()"
              [attr.aria-label]="
                motDePasseVisible() ? 'Masquer le mot de passe' : 'Afficher le mot de passe'
              "
            >
              @if (motDePasseVisible()) {
                <svg
                  width="20"
                  height="20"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.4"
                >
                  <path
                    d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"
                  />
                  <line x1="1" y1="1" x2="23" y2="23" />
                </svg>
              } @else {
                <svg
                  width="20"
                  height="20"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.4"
                >
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              }
            </button>
          </div>
        </div>

        @if (erreur()) {
          <p class="erreur">{{ erreur() }}</p>
        }

        <button type="submit" class="btn accent bloc" [disabled]="envoi()">
          {{ envoi() ? 'Connexion…' : 'Se connecter' }}
        </button>
      </form>
    </div>
  </div>
</div>
